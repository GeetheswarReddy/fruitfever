<svg width="100%" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FreshScan hardware connection diagram</title>
  <desc>Wiring diagram showing the ESP32-CAM and ESP32 Dev Board with all connected sensors, LCD, buzzer, and the UART link between the two boards.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #2C2C2A; }
      .ts { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .th { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .pin { font-family: "Menlo", "Consolas", monospace; font-size: 11px; fill: #2C2C2A; }
      .pinmuted { font-family: "Menlo", "Consolas", monospace; font-size: 11px; fill: #5F5E5A; }
      .red   { stroke: #E24B4A; }
      .black { stroke: #2C2C2A; }
      .blue  { stroke: #378ADD; }
      .green { stroke: #639922; }
      .amber { stroke: #BA7517; }
      .purple{ stroke: #7F77DD; }
    </style>
  </defs>

  <!-- =================== TITLE =================== -->
  <text class="th" x="340" y="32" text-anchor="middle" style="font-size:16px">FreshScan — Hardware Connection Diagram</text>
  <text class="ts" x="340" y="50" text-anchor="middle">ESP32 Dev Board + ESP32-CAM (AI Thinker), linked over UART Serial2 @ 9600 baud</text>

  <!-- =================== ESP32-CAM BOARD (LEFT) =================== -->
  <g>
    <rect x="40" y="90" width="240" height="240" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text class="th" x="160" y="115" text-anchor="middle" fill="#0C447C">ESP32-CAM</text>
    <text class="ts" x="160" y="132" text-anchor="middle" fill="#185FA5">AI Thinker board</text>

    <!-- Camera module representation -->
    <rect x="120" y="148" width="80" height="50" rx="4" fill="#2C2C2A" stroke="#2C2C2A"/>
    <circle cx="160" cy="173" r="14" fill="#5F5E5A" stroke="#2C2C2A"/>
    <circle cx="160" cy="173" r="7" fill="#2C2C2A"/>
    <text class="ts" x="160" y="214" text-anchor="middle" fill="#185FA5">OV2640 camera</text>

    <!-- Left side pins (programming + power) -->
    <text class="pin" x="56"  y="244" text-anchor="start">5V</text>
    <text class="pin" x="56"  y="262" text-anchor="start">GND</text>
    <text class="pin" x="56"  y="280" text-anchor="start">U0R (RX)</text>
    <text class="pin" x="56"  y="298" text-anchor="start">U0T (TX)</text>
    <text class="pinmuted" x="56" y="316" text-anchor="start">IO0 (boot)</text>

    <!-- Right side pins (UART + others) -->
    <text class="pin" x="264" y="244" text-anchor="end">GPIO15  (TX2)</text>
    <text class="pin" x="264" y="262" text-anchor="end">GPIO14  (RX2)</text>
    <text class="pin" x="264" y="280" text-anchor="end">GND</text>
    <text class="pinmuted" x="264" y="298" text-anchor="end">GPIO13</text>
    <text class="pinmuted" x="264" y="316" text-anchor="end">GPIO12</text>

    <!-- Pin dots -->
    <circle cx="46"  cy="240" r="2.5" fill="#E24B4A"/>
    <circle cx="46"  cy="258" r="2.5" fill="#2C2C2A"/>
    <circle cx="46"  cy="276" r="2.5" fill="#5F5E5A"/>
    <circle cx="46"  cy="294" r="2.5" fill="#5F5E5A"/>
    <circle cx="46"  cy="312" r="2.5" fill="#5F5E5A"/>
    <circle cx="274" cy="240" r="2.5" fill="#7F77DD"/>
    <circle cx="274" cy="258" r="2.5" fill="#7F77DD"/>
    <circle cx="274" cy="276" r="2.5" fill="#2C2C2A"/>
    <circle cx="274" cy="294" r="2.5" fill="#5F5E5A"/>
    <circle cx="274" cy="312" r="2.5" fill="#5F5E5A"/>
  </g>

  <!-- =================== ESP32 DEV BOARD (RIGHT) =================== -->
  <g>
    <rect x="400" y="90" width="240" height="380" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text class="th" x="520" y="115" text-anchor="middle" fill="#173404">ESP32 Dev Board</text>
    <text class="ts" x="520" y="132" text-anchor="middle" fill="#3B6D11">Main controller (38-pin)</text>

    <!-- USB representation -->
    <rect x="490" y="148" width="60" height="20" rx="2" fill="#888780" stroke="#444441"/>
    <text class="ts" x="520" y="162" text-anchor="middle" fill="#fff">USB</text>

    <!-- Left side pins -->
    <text class="pin" x="416" y="200" text-anchor="start">3V3</text>
    <text class="pin" x="416" y="220" text-anchor="start">GND</text>
    <text class="pin" x="416" y="240" text-anchor="start">GPIO13  (RX2)</text>
    <text class="pin" x="416" y="260" text-anchor="start">GPIO14  (TX2)</text>
    <text class="pin" x="416" y="280" text-anchor="start">GPIO4   (DHT)</text>
    <text class="pin" x="416" y="300" text-anchor="start">GPIO34  (MQ2)</text>
    <text class="pin" x="416" y="320" text-anchor="start">GPIO5   (BUZ)</text>
    <text class="pin" x="416" y="340" text-anchor="start">GPIO21  (SDA)</text>
    <text class="pin" x="416" y="360" text-anchor="start">GPIO22  (SCL)</text>
    <text class="pinmuted" x="416" y="380" text-anchor="start">EN</text>

    <!-- Right side pins -->
    <text class="pin" x="624" y="200" text-anchor="end">VIN  (5V)</text>
    <text class="pin" x="624" y="220" text-anchor="end">GND</text>
    <text class="pinmuted" x="624" y="240" text-anchor="end">GPIO23</text>
    <text class="pinmuted" x="624" y="260" text-anchor="end">GPIO19</text>
    <text class="pinmuted" x="624" y="280" text-anchor="end">GPIO18</text>

    <!-- Pin dots left -->
    <circle cx="406" cy="196" r="2.5" fill="#E24B4A"/>
    <circle cx="406" cy="216" r="2.5" fill="#2C2C2A"/>
    <circle cx="406" cy="236" r="2.5" fill="#7F77DD"/>
    <circle cx="406" cy="256" r="2.5" fill="#7F77DD"/>
    <circle cx="406" cy="276" r="2.5" fill="#639922"/>
    <circle cx="406" cy="296" r="2.5" fill="#BA7517"/>
    <circle cx="406" cy="316" r="2.5" fill="#E24B4A"/>
    <circle cx="406" cy="336" r="2.5" fill="#378ADD"/>
    <circle cx="406" cy="356" r="2.5" fill="#378ADD"/>

    <!-- Pin dots right -->
    <circle cx="634" cy="196" r="2.5" fill="#E24B4A"/>
    <circle cx="634" cy="216" r="2.5" fill="#2C2C2A"/>
  </g>

  <!-- =================== UART CONNECTION (between boards) =================== -->
  <!-- TX(CAM GPIO15) -> RX(Dev GPIO13) -->
  <path d="M274 240 Q 340 240 340 236 L 406 236" fill="none" stroke="#7F77DD" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="226" text-anchor="middle" fill="#3C3489">CAM TX → Dev RX</text>

  <!-- RX(CAM GPIO14) <- TX(Dev GPIO14) -->
  <path d="M406 256 L 340 256 Q 274 256 274 258" fill="none" stroke="#7F77DD" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="272" text-anchor="middle" fill="#3C3489">Dev TX → CAM RX</text>

  <!-- GND between boards (shared ground!) -->
  <path d="M274 276 L 406 216" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="298" text-anchor="middle">Common GND (required)</text>

  <!-- =================== DHT11 SENSOR =================== -->
  <g>
    <rect x="40" y="370" width="120" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B"/>
    <text class="th" x="100" y="390" text-anchor="middle" fill="#412402">DHT11</text>
    <text class="ts" x="100" y="406" text-anchor="middle" fill="#854F0B">Temp + humidity</text>
    <text class="pin" x="100" y="425" text-anchor="middle">VCC | DATA | GND</text>
  </g>
  <!-- DHT11 -> Dev Board (GPIO4 = DATA, 3V3, GND) -->
  <path d="M160 405 L 280 405 L 280 280 L 406 280" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="220" y="398" fill="#3B6D11">DATA → GPIO4</text>
  <text class="ts" x="220" y="415" fill="#5F5E5A">+ 3V3, GND</text>

  <!-- 10kΩ pull-up note -->
  <text class="ts" x="100" y="455" text-anchor="middle" fill="#854F0B">10 kΩ pull-up: DATA ↔ 3V3</text>

  <!-- =================== MQ-2 GAS SENSOR =================== -->
  <g>
    <rect x="40" y="480" width="120" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B"/>
    <text class="th" x="100" y="500" text-anchor="middle" fill="#412402">MQ-2</text>
    <text class="ts" x="100" y="516" text-anchor="middle" fill="#854F0B">Gas / VOC (analog)</text>
    <text class="pin" x="100" y="535" text-anchor="middle">VCC | AO | GND</text>
  </g>
  <!-- MQ-2 -> Dev Board (GPIO34 = AO, 5V from VIN, GND) -->
  <path d="M160 515 L 300 515 L 300 300 L 406 300" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="240" y="508" fill="#854F0B">AO → GPIO34</text>
  <text class="ts" x="240" y="525" fill="#5F5E5A">+ 5V (VIN), GND</text>

  <!-- =================== I2C LCD =================== -->
  <g>
    <rect x="40" y="580" width="160" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="th" x="120" y="600" text-anchor="middle" fill="#042C53">16×2 I2C LCD</text>
    <text class="ts" x="120" y="616" text-anchor="middle" fill="#185FA5">PCF8574 backpack (0x27)</text>
    <text class="pin" x="120" y="635" text-anchor="middle">VCC | GND | SDA | SCL</text>
  </g>
  <!-- LCD -> Dev Board (SDA=21, SCL=22) -->
  <path d="M200 615 L 320 615 L 320 340 L 406 340" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="260" y="608" fill="#0C447C">SDA → GPIO21</text>
  <path d="M200 625 L 330 625 L 330 360 L 406 360" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="260" y="648" fill="#0C447C">SCL → GPIO22  + 5V, GND</text>

  <!-- =================== BUZZER =================== -->
  <g>
    <circle cx="100" cy="695" r="28" fill="#FCEBEB" stroke="#A32D2D"/>
    <circle cx="100" cy="695" r="14" fill="#F09595"/>
    <text class="ts" x="100" y="698" text-anchor="middle" fill="#501313">BUZZ</text>
    <text class="th" x="100" y="745" text-anchor="middle" fill="#501313">Active buzzer</text>
  </g>
  <!-- Buzzer -> Dev Board (GPIO5) -->
  <path d="M128 695 L 350 695 L 350 320 L 406 320" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="240" y="688" fill="#A32D2D">+ → GPIO5,  − → GND</text>

  <!-- =================== POWER NOTE =================== -->
  <g>
    <rect x="220" y="585" width="180" height="65" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text class="th" x="310" y="605" text-anchor="middle">⚠ Power</text>
    <text class="ts" x="310" y="623" text-anchor="middle">CAM: separate 5 V supply</text>
    <text class="ts" x="310" y="639" text-anchor="middle">(or CH340 5 V — not 3V3)</text>
  </g>

  <!-- =================== LEGEND =================== -->
  <g transform="translate(40, 730)">
    <line x1="0"   y1="0" x2="20" y2="0" class="red"    stroke-width="2"/>
    <line x1="80"  y1="0" x2="100" y2="0" class="black" stroke-width="2"/>
    <line x1="160" y1="0" x2="180" y2="0" class="purple" stroke-width="2"/>
    <line x1="240" y1="0" x2="260" y2="0" class="blue"  stroke-width="2"/>
    <line x1="320" y1="0" x2="340" y2="0" class="green" stroke-width="2"/>
    <line x1="400" y1="0" x2="420" y2="0" class="amber" stroke-width="2"/>
    <text class="ts" x="26"  y="4">Power</text>
    <text class="ts" x="106" y="4">GND</text>
    <text class="ts" x="186" y="4">UART</text>
    <text class="ts" x="266" y="4">I2C</text>
    <text class="ts" x="346" y="4">Digital</text>
    <text class="ts" x="426" y="4">Analog</text>
  </g>
</svg>
